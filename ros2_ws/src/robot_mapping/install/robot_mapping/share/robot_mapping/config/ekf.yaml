# Initial planar configuration; covariance values require physical calibration.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    use_control: false

    # Order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Wheel pose and wheel velocity come from the same encoders:
    # use velocity only, avoiding duplicate pose information.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Raw calibrated gyro yaw rate. No magnetic heading or acceleration fusion.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false
